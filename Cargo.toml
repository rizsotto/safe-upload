[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.0.0"
edition = "2024"
license = "GPL-3.0-or-later"
publish = false

[workspace.dependencies]
adw = { package = "libadwaita", version = "0.9", features = ["v1_4"] }
gettext-rs = { version = "0.7", default-features = false, features = ["gettext-system"] }
gtk = { package = "gtk4", version = "0.11" }

# mozjpeg's C code is about twice as slow unoptimized, which makes the
# encoder and fit-to-size tests slow.
[profile.dev.package.mozjpeg-sys]
opt-level = 3
