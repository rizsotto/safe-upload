name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: devcontainers/ci@v0.3
        with:
          configFile: .github/ci/devcontainer.json
          runCmd: |
            set -euo pipefail
            build-aux/ci/test-check-no-network-crates.sh
            build-aux/ci/check-no-network-crates.sh Cargo.lock
            cargo fmt --all -- --check
            cargo clippy --workspace --all-targets -- -D warnings
            cargo test --workspace
